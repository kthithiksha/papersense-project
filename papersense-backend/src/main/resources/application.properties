# ============================================
# Server
# ============================================
server.port=${PORT:8080}

# ============================================
# Database Configuration
#
# Local development uses MySQL by default. Render supplies DATABASE_URL,
# DB_USERNAME, and DB_PASSWORD for its managed PostgreSQL database.
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/papersensedb?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================
# File Upload Settings
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Directory (relative to where the app runs) where uploaded PDFs are stored
papersense.upload.dir=${PAPERSENSE_UPLOAD_DIR:uploads}

# ============================================
# AI Service Configuration
# ============================================
# ============================================
# AI Service Configuration (Google Gemini)
# ============================================
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=}
ai.api.model=${AI_API_MODEL:gemini-3.5-flash}
ai.chunk.max-chars=12000

# ============================================
# Logging
# ============================================
logging.level.com.papersense=INFO
