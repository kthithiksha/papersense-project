services:
  - type: web
    name: papersense-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./papersense-backend/Dockerfile
    dockerContext: ./papersense-backend
    healthCheckPath: /api/papers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papersense-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: papersense-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: papersense-db
          property: password
      - key: AI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PAPERSENSE_UPLOAD_DIR
        value: /tmp/papersense/uploads

databases:
  - name: papersense-db
    databaseName: papersensedb
    user: papersense
    region: singapore
    plan: free
